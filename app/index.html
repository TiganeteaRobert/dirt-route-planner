<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a15">
  <meta name="description" content="Offline dirt-bike map for Cluj-Napoca and the Apuseni mountains">
  <title>DirtScout</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="status" aria-live="polite">
      <button id="st-gps" class="pill" type="button">GPS off</button>
      <button id="st-rec" class="pill pill-rec" type="button" hidden></button>
      <span id="st-net" class="pill pill-off" hidden>No network</span>
      <button id="st-dl" class="pill pill-dl" type="button" hidden></button>
    </div>
    <section id="sheet" class="sheet" hidden aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Close">&#x2715;</button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </section>
    <div id="toast" role="status" hidden></div>
    <div id="drawbar" hidden>
      <div id="drawbar-text">Tap along the road</div>
      <div class="row-btns">
        <button type="button" class="btn" id="draw-undo">Undo</button>
        <button type="button" class="btn" id="draw-cancel">Cancel</button>
        <button type="button" class="btn primary" id="draw-save">Save</button>
      </div>
    </div>
    <nav id="toolbar">
      <button type="button" data-sheet="layers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-7.9 9.6L2 13.8 12 19.3l10-5.5-2.1-1.2-7.9 4.4-7.9-4.4Z"/></svg>
        <span>Layers</span>
      </button>
      <button type="button" id="btn-locate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
        <span>Locate</span>
      </button>
      <button type="button" id="btn-record">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Z"/></svg>
        <span>Record</span>
      </button>
      <button type="button" data-sheet="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3a2.5 2.5 0 0 0-1 4.8V19h2V7.8A2.5 2.5 0 0 0 5 3Zm14 14a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM8 6h5.5a3.5 3.5 0 0 1 0 7H10a1.5 1.5 0 0 0 0 3h6v2h-6a3.5 3.5 0 0 1 0-7h3.5a1.5 1.5 0 0 0 0-3H8V6Z"/></svg>
        <span>Plan</span>
      </button>
      <button type="button" data-sheet="downloads">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3V3ZM4 18h16v3H4v-3Z"/></svg>
        <span>Offline</span>
      </button>
      <button type="button" data-sheet="tracks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3a3 3 0 0 0-1 5.8V9a5 5 0 0 0 5 5h4a3 3 0 0 1 3 3v.2a3 3 0 1 0 2 0V17a5 5 0 0 0-5-5h-4a3 3 0 0 1-3-3v-.2A3 3 0 0 0 6 3Z"/></svg>
        <span>Tracks</span>
      </button>
      <button type="button" data-sheet="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2.5H4V6Zm0 4.75h16v2.5H4v-2.5ZM4 15.5h16V18H4v-2.5Z"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
