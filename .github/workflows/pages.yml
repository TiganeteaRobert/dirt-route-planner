name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The area pack (pipeline/, built on the PC) is a release asset, not part of git: take the newest pack-* release.
      - name: Add the area pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("pack-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -n "$TAG" ]; then
            mkdir -p dist/pack
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/pack --pattern '*.pmtiles' --pattern '*.json' --pattern '*.enc'
          fi
          ls -la dist/pack || echo "no area pack release yet"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
